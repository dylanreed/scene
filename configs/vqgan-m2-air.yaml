# ABOUTME: VQGAN config optimized for M2 MacBook Air 16GB
# ABOUTME: Balances speed vs quality for thermal-throttled laptops

model:
  in_channels: 3
  hidden_channels: 96        # compromise between 64 and 128
  num_res_blocks: 2          # reduced to save compute
  codebook_size: 512
  codebook_dim: 192          # compromise between 128 and 256
  downsample_factor: 16

training:
  batch_size: 8              # higher batch = fewer steps = faster epochs
  gradient_accumulation: 2   # effective batch size = 16
  learning_rate_g: 0.0001
  learning_rate_d: 0.00002
  num_epochs: 100
  save_every: 5              # save less often to reduce I/O
  sample_every: 5

  # Discriminator balance
  disc_weight: 0.8
  disc_train_every: 2
  disc_start_epoch: 0

  # Learning rate schedule
  lr_warmup_epochs: 5
  lr_schedule: cosine

  # Codebook settings
  codebook_ema: true
  codebook_ema_decay: 0.99
  codebook_reset_threshold: 2

  # Memory management - aggressive to prevent freezes
  memory_cleanup_every: 4    # force eval + gc every 4 steps
  gc_every_epoch: true

data:
  image_size: [320, 192]
  data_dir: "data/images"

metrics:
  log_file: "outputs/training_metrics.csv"
  fid_every: 0
  fid_samples: 500
  fid_full_at_end: false
