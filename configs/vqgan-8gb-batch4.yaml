# ABOUTME: VQGAN config for 8GB RAM with larger batch size
# ABOUTME: batch_size=4, accumulation=4 for effective batch of 16

model:
  in_channels: 3
  hidden_channels: 64
  num_res_blocks: 2
  codebook_size: 512
  codebook_dim: 128
  downsample_factor: 16

training:
  batch_size: 4             # up from 3
  gradient_accumulation: 4  # down from 5 (effective = 16)
  learning_rate_g: 0.0001
  learning_rate_d: 0.00002
  num_epochs: 100
  save_every: 1
  sample_every: 1

  # Discriminator balance
  disc_weight: 0.8
  disc_train_every: 2
  disc_start_epoch: 0

  # Learning rate schedule
  lr_warmup_epochs: 5
  lr_schedule: cosine

  # Codebook settings
  codebook_ema: true
  codebook_ema_decay: 0.99
  codebook_reset_threshold: 2

  # Memory management
  memory_cleanup_every: 0
  gc_every_epoch: true

data:
  image_size: [320, 192]
  data_dir: "data/images"
  cache_in_memory: true

metrics:
  log_file: "outputs/training_metrics.csv"
  fid_every: 0
  fid_samples: 500
  fid_full_at_end: false
